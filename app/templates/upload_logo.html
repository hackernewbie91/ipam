{% extends "base.html" %}
{% block page_title %}Change Logo{% endblock %}
{% block breadcrumb %}Change Logo{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="ti ti-photo"></i> Upload Company Logo</h3>
            </div>
            <div class="card-body">
                {% if current_logo %}
                <div class="text-center mb-4">
                    <img src="{{ current_logo }}" alt="Current Logo" style="max-height: 120px; max-width: 100%;">
                    <p class="text-muted mt-2">Current Logo</p>
                </div>
                <hr>
                {% endif %}
                
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Pilih File Logo Baru</label>
                        <input type="file" name="logo" class="form-control" accept=".png,.jpg,.jpeg,.gif,.svg,.webp" required>
                        <div class="form-text text-muted">Format: PNG, JPG, JPEG, GIF, SVG, WEBP. Maks 5MB.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ti ti-upload"></i> Upload Logo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
